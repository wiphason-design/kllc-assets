<style>
:root{--bg:#0a0f1c;--panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--txt:#eef1f8;--mut:#98a1b3;--gold:#d8b45a;--gold2:#f0d48a;--blue:#5aa7ff;--green:#3ecf8e;--amber:#f5b54a;--red:#ff6b6b;--grad:linear-gradient(135deg,#f6dd9a,#d8b45a 45%,#a97f2a);--r:18px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Sarabun',sans-serif;color:var(--txt);padding:22px;max-width:1280px;margin:0 auto;background:radial-gradient(1100px 560px at 85% -10%,rgba(90,167,255,.14),transparent 60%),radial-gradient(900px 520px at 8% 112%,rgba(216,180,90,.12),transparent 60%),var(--bg);min-height:100vh}
h1,h2,h3,.num,.tab,.btn{font-family:'Prompt','Sarabun',sans-serif}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:flex;align-items:center;justify-content:center}
.sub{color:var(--mut);font-size:12.5px;margin:6px 0 16px}

.modeBtn{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:7px 15px;font-size:12.5px;cursor:pointer}.modeBtn.active{background:var(--grad);color:#241a05;font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tab{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:9px 18px;font-size:13px;cursor:pointer}.tab.active{background:var(--grad);color:#241a05;font-weight:700}
section.hidden{display:none}.panel{padding:20px;margin-bottom:16px}.panel h2{font-size:15.5px;margin-bottom:14px;color:var(--gold2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{padding:16px}.card .num{font-size:26px;font-weight:700}.card .lbl{font-size:12px;color:var(--mut)}
.c-blue .num{color:var(--blue)}.c-green .num{color:var(--green)}.c-amber .num{color:var(--amber)}.c-red .num{color:var(--red)}.c-gold .num{color:var(--gold2)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}th{color:var(--gold2);font-size:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;white-space:nowrap}
.bar{background:rgba(255,255,255,.1);border-radius:99px;height:8px;overflow:hidden;min-width:110px}.bar i{display:block;height:100%}
input,select{background:rgba(10,15,28,.6);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 12px;font-size:13px}
.btn{border:none;border-radius:12px;padding:10px 18px;cursor:pointer;font-size:13px;font-weight:700}.btn.gold{background:var(--grad);color:#241a05}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}.btn.danger{background:transparent;border:1px solid rgba(255,107,107,.5);color:var(--red)}
.form-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.room{padding:15px;cursor:pointer;border:1px solid var(--line)}.room.sel{border-color:var(--gold)}.room .code{color:var(--blue);font-size:12px}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%}
.lineBubble{background:linear-gradient(135deg,#f4ffe9,#e7ffd9);color:#1d3311;border-radius:16px;padding:16px;font-size:13px;white-space:pre-line;max-width:480px}
#proposalDoc,#checkReport{background:#fff;color:#111;border-radius:12px;padding:36px;line-height:1.9;font-size:15px}#proposalDoc th,#proposalDoc td,#checkReport th,#checkReport td{border:1px solid #555;color:#111;padding:6px 8px;font-size:13px}#checkReport{display:none}

.insight{background:rgba(90,167,255,.06);border-left:3px solid var(--gold);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.9}
